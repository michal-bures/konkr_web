<script>
    // ES5 on purpose, so it runs on browsers too old for the script below. The bundles are ES2021 (vite.config.mts),
    // with core-js polyfills for newer built-ins; older browsers fail to parse them, so check the newest syntax they
    // use (logical assignment: Chrome 85, Safari 14, Firefox 79) and tell the player instead of loading forever
    window.konkrBrowserSupported = (function () {
        try {
            new Function('let a = null; a ??= 1; a ||= 2; a &&= 3; return 1_000')
            return true
        } catch (e) {
            return false
        }
    })()
    // here rather than in the script below, so the unsupported browser message can use it
    window.showFatalError = function (message) {
        document.getElementById('status').innerHTML = message + "<br/><br/><span class='fatal-error-help'>" +
            'Your browser: ' + describeBrowser(navigator.userAgent) + '<br/>' +
            "Still stuck? <a href='https://discord.gg/uAxWkPuP6A' target='_blank'>Ask on Discord</a></span>"
        document.getElementById('loader').className = 'hidden'
        document.getElementById('phaser-game').className = 'hidden'
        // it would cover the help line on short screens, and its news don't matter when the game can't start
        document.getElementById('news-box').style.display = 'none'
    }

    // players often can't tell, and it's the first thing to ask them; the whole user agent when it's none of these
    function describeBrowser(userAgent) {
        var browsers = [
            ['Edge', /Edg(?:e|A|iOS)?\/(\d+)/],
            ['Opera', /OPR\/(\d+)/],
            ['Samsung Internet', /SamsungBrowser\/(\d+)/],
            ['Firefox', /(?:Firefox|FxiOS)\/(\d+)/],
            ['Chrome', /(?:Chrome|CriOS)\/(\d+)/],
            ['Safari', /Version\/(\d+(?:\.\d+)?).*Safari/]
        ]
        // every iOS browser runs on the system's Safari, so the iOS version is what decides
        var ios = /(?:iPhone|iPad|iPod).* OS (\d+)_(\d+)/.exec(userAgent)
        var onIos = ios ? ' on iOS ' + ios[1] + '.' + ios[2] : ''
        for (var i = 0; i < browsers.length; i++) {
            var match = browsers[i][1].exec(userAgent)
            if (match) return browsers[i][0] + ' ' + match[1] + onIos
        }
        return userAgent.replace(/</g, '&lt;')
    }

    if (!window.konkrBrowserSupported) {
        showFatalError("Konkr can't run in this browser.<br/>Please update your browser, or try a recent Chrome, Firefox, Safari or Edge.")
    }
</script>
<script>
    const BUILD_NUMBER = '2.37.1-build-40650976910'
    const BUILD_LABEL = '#241 bug-triage-2026-10'
    const SW_ENABLE = true

    // store current time for timing page load
    window.tStart = performance.now()
    const statusElement = document.getElementById('status')
    const loaderElement = document.getElementById('loader')
    const gameElement = document.getElementById('phaser-game')
    window.setLoadingStatus = (status, isLoading) => {
        statusElement.innerHTML = status
        if (isLoading === false) {
            loaderElement.classList.add('hidden')
            if (!status) {
                gameElement.classList.remove('hidden')
            } else {
                gameElement.classList.add('hidden')
            }
        } else {
            loaderElement.classList.remove('hidden')
            gameElement.classList.add('hidden')
        }

    }

    // if news-box has no content, inject warning
    const newsBox = document.getElementById('news-box-body')
    if (newsBox?.innerText.startsWith('{{ ' + 'content }}')) {
        newsBox.innerHTML = `<p><b>⚠ Warning:</b> Playing unsupported game version</p><p class='build-info'>${[BUILD_LABEL, BUILD_NUMBER].filter(Boolean).join('<br/>')}</p>
                         <p>Visit <a href='https://www.konkr.io'>www.konkr.io</a> to play the latest stable release.<br/>
                         Or don't, I'm not your boss, but proceed with caution.</p>`
    }

    // otherwise the script above shows why the game can't start
    if (window.konkrBrowserSupported) {
        setLoadingStatus('loading game...')
        window.addEventListener('DOMContentLoaded', () => boot())
    }

    function supportsServiceWorker()  {
        try {
            return !!(window.localStorage && navigator.serviceWorker);
        } catch (e) {
            return false;
        }
    }

    function startGame() {
        // missing when the game's script failed to download or threw while loading
        if (typeof window.launchGame !== 'function') {
            console.error('window.launchGame is not defined, the game script failed to load')
            showFatalError(`The game couldn't load.<br/>Check your connection and reload the page.`)
            return
        }
        window.launchGame()
    }

    async function boot(safeMode = false) {
        if (!safeMode && supportsServiceWorker()) {
            try {
                const cachedBuild = window.localStorage?.getItem('konkr.cached_build')
                window.localStorage.setItem('konkr.cached_build', BUILD_NUMBER)
                if (cachedBuild && cachedBuild !== BUILD_NUMBER) {
                    setLoadingStatus('downloading update...')
                    //new version detected => purge cache and any old service workers and reload
                    console.warn(`New version is available! (installed = ${cachedBuild}, available = ${BUILD_NUMBER}), updating!`)
                    window.caches?.keys()
                        .then(cacheNames => {
                            cacheNames.forEach(cacheName => {
                                caches.delete(cacheName)
                            })
                        })
                        .then(purgeServiceWorkers)
                        .then(() => {
                            window.location.reload()
                        })
                    return
                } else {
                    //version recognized, everything is most likely already cached by SW
                    setLoadingStatus('loading game...')
                    startGame()
                }

                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    //reload if new service worker takes control of running app
                    console.info('new service worker activated')
                })

                if (SW_ENABLE) {
                    navigator.serviceWorker.register('./sw.js', { scope: serviceWorkerScope() }).catch(err=> {
                        console.error('Failed to register service worker', err)
                    })
                } else {
                    await purgeServiceWorkers()
                }
            } catch (error) {
                console.error('error updating game, restarting in safe mode')

                try {
                    await purgeServiceWorkers()
                } catch(error) {
                    console.error('failed to purge service workers')
                }
                await boot(true)
            }

        } else {
            setLoadingStatus('loading game...')
            startGame()
        }
    }

    // the game's root, not the deep link the page was opened at (as routeRootPath() in src/services/appRoutes.ts)
    function serviceWorkerScope() {
        const basePath = new URL(document.baseURI).pathname
        const { pathname } = window.location
        return pathname.startsWith(basePath) || pathname + '/' === basePath ? basePath : '/'
    }

    function purgeServiceWorkers() {
        return navigator.serviceWorker.getRegistrations()
            .then(registrations => {
                for (let registration of registrations) {
                    registration.unregister()
                }
            })
    }
</script>
