[[redirects]]
  from = "/v2/dev/*"
  to = "/"

# The game's deep links (konkr2 src/services/appRoutes.ts) serve the game page of the home page, a release or a dev build.
# Rewrites skip paths where a file exists, so the builds' assets are unaffected
[[redirects]]
  from = "/expeditions"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/expeditions/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/levels/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/conquest"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/library"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/editor"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/quickload"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/releases/:version/expeditions"
  to = "/releases/:version/index.html"
  status = 200
[[redirects]]
  from = "/releases/:version/expeditions/*"
  to = "/releases/:version/index.html"
  status = 200
[[redirects]]
  from = "/releases/:version/levels/*"
  to = "/releases/:version/index.html"
  status = 200
[[redirects]]
  from = "/releases/:version/conquest"
  to = "/releases/:version/index.html"
  status = 200
[[redirects]]
  from = "/releases/:version/library"
  to = "/releases/:version/index.html"
  status = 200
[[redirects]]
  from = "/releases/:version/editor"
  to = "/releases/:version/index.html"
  status = 200
[[redirects]]
  from = "/releases/:version/quickload"
  to = "/releases/:version/index.html"
  status = 200
[[redirects]]
  from = "/releases/dev/:branch/expeditions"
  to = "/releases/dev/:branch/index.html"
  status = 200
[[redirects]]
  from = "/releases/dev/:branch/expeditions/*"
  to = "/releases/dev/:branch/index.html"
  status = 200
[[redirects]]
  from = "/releases/dev/:branch/levels/*"
  to = "/releases/dev/:branch/index.html"
  status = 200
[[redirects]]
  from = "/releases/dev/:branch/conquest"
  to = "/releases/dev/:branch/index.html"
  status = 200
[[redirects]]
  from = "/releases/dev/:branch/library"
  to = "/releases/dev/:branch/index.html"
  status = 200
[[redirects]]
  from = "/releases/dev/:branch/editor"
  to = "/releases/dev/:branch/index.html"
  status = 200
[[redirects]]
  from = "/releases/dev/:branch/quickload"
  to = "/releases/dev/:branch/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://*.kongregate.com https://*.itch.io https://*.itch.zone https://v6p9d9t4.ssl.hwcdn.net https://uploads.ungrounded.net https://www.newgrounds.com https://igre.games https://webgamer.io"
    Service-Worker-Allowed = "/"
