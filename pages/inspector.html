<html>
<head>

    <title>Konkr data inspector</title>
    <link rel="icon" type="image/png" href="/img/favicon-16.png" sizes="16x16">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"
            integrity="sha512-WFN04846sdKMIP5LKNphMaWzU7YpMyCU245etK3g/2ARYbPK9Ub18eG+ljU96qKRCWh+quCY7yefSmlkQw1ANQ=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lzutf8/0.6.3/lzutf8.min.js"
            integrity="sha512-jsnMjzAAVwJt3pKB5KXVMj/TO9pc8NrmEEde/ynXffVEEiaoH74/x2KIqIa0ZaLvNsJfNPaLdukkVWa0RRKbOw=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.3/umd/index.js"
            integrity="sha384-ETfVLWAUsU3zp3SpnQsPDbAyrF6jYv2w8aNYo6KtY2JuyxXhzYLOL7e0ATbLSIHP"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/10.1.0/jsoneditor.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/10.1.0/jsoneditor.min.css"
          integrity="sha512-8G+Vb2+10BSrSo+wupdzJIylDLpGtEYniQhp0rsbTigPG7Onn2S08Ai/KEGlxN2Ncx9fGqVHtRehMuOjPb9f8g=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>


    <style>
        #root {
            width: 100%;
            height: 100%;
            flex-direction: column;
            display: flex;
            align-items: stretch;
        }


        #root > *:nth-child(1) {
            max-height: 120px;
        }

        #root > *:nth-child(2) {
            flex-grow: 1;
        }
        .panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        #decoded {
            flex-grow: 1;
        }

        #encoded {
            flex-grow: 1;
            font-family: monospace;
            font-size: 10px;
        }

        #decoded-row {
            flex-grow: 1;
            display: flex;
        }

        #sketch {
            overflow: auto;
            padding: 8px;
            font-family: monospace;
            font-size: 10px;
        }

        /* island sketch, see docs/plans/island-sketch.md in the game repo */
        .sketch-row {
            display: flex;
            height: 10px;
        }

        .sketch-row.even {
            padding-left: 6px;
        }

        .sketch-hex {
            flex: none;
            width: 11px;
            height: 11px;
            margin-right: 1px;
            border-radius: 2px;
            color: white;
            font-size: 9px;
            line-height: 11px;
            text-align: center;
        }
    </style>
</head>


<body>
<div id="root">
    <div class="panel">
        <textarea id="encoded" placeholder="paste encoded konkr data here"></textarea>
    </div>
    <div class="panel">
        <input id="prefix" placeholder="prefix"></input>
        <div id="decoded-row">
            <div id="decoded"></div>
            <div id="sketch"></div>
        </div>
    </div>

</div>

<script>

    const {_} = window;

    const DOM = {
        encoded: document.getElementById('encoded'),
        decoded: document.getElementById('decoded'),
        prefix: document.getElementById('prefix'),
        sketch: document.getElementById('sketch'),
    }
    const decodedEditor = new JSONEditor(DOM.decoded, {
        mode: 'code',
        onChange: _.debounce(() => {
            encode()
            showSketch(tryGetEditorData())
        }, 300),
        modes: ['code', 'tree']
    })

    DOM.encoded.oninput = _.debounce(() => {
        persistInput()
        decode();
    }, 300)
    DOM.encoded.onfocus = ()=> {
        DOM.encoded.select()
    }
    DOM.prefix.oninput = _.debounce(encode, 300)

    restoreInput()

    function persistInput() {
        window.localStorage?.setItem('decoded', DOM.encoded.value)
    }

    function restoreInput() {
        DOM.encoded.value = window.localStorage?.getItem('decoded') ?? ''
        if (DOM.encoded.value) decode()
    }

    function decode() {
        if (DOM.encoded.value.startsWith('"')) {
            DOM.encoded.value = DOM.encoded.value.slice(1)
        }
        if (DOM.encoded.value.endsWith('"')) {
            DOM.encoded.value = DOM.encoded.value.slice(0, -1)
        }

        try {
            const {prefix, data} = decodeKonkr(DOM.encoded.value)
            DOM.prefix.value = prefix
            DOM.decoded.value = data
            decodedEditor.set(JSON.parse(data))
            showSketch(JSON.parse(data))
        } catch (err) {
            console.error(err)
            DOM.prefix.value = ''
            decodedEditor.set(`Error: ${err.message}`)
            showSketch(undefined)
        }
    }

    function encode() {
        try {
            DOM.encoded.value = encodeKonkr(DOM.prefix.value, decodedEditor.get())
        } catch (err) {
            console.error(err)
            DOM.encoded.value = `Error: ${err.message}`
        }
    }

    // gzip strings carry a 'gz' marker after the version (konkrmap.v7.gz.<base64>), older ones are LZUTF8
    function encodeKonkr(prefix, object) {
        const json = JSON.stringify(object)
        if (prefix.endsWith('.gz')) {
            const bytes = fflate.gzipSync(fflate.strToU8(json), {mtime: 0})
            return prefix + '.' + bytesToBase64(bytes)
        }
        return prefix + '.' + LZUTF8.compress(json, {inputEncoding: 'String', outputEncoding: 'Base64'})
    }

    function decodeKonkr(serializedData) {
        const segments = serializedData.split('.')
        const gzip = segments[2] === 'gz'
        const prefix = segments.slice(0, gzip ? 3 : 2).join('.')
        const payload = serializedData.substring(prefix.length + 1)
        const data = gzip
            ? fflate.strFromU8(fflate.gunzipSync(base64ToBytes(payload)))
            : LZUTF8.decompress(payload, {inputEncoding: 'Base64', outputEncoding: 'String'}).toString()
        return {prefix, data}
    }

    function bytesToBase64(bytes) {
        let binary = ''
        for (let i = 0; i < bytes.length; i += 0x8000) {
            binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000))
        }
        return btoa(binary)
    }

    function base64ToBytes(base64) {
        return Uint8Array.from(atob(base64), char => char.charCodeAt(0))
    }

    function tryGetEditorData() {
        try {
            return decodedEditor.get()
        } catch (err) {
            return undefined // invalid JSON while typing
        }
    }

    // Island sketch: a copy of sketchIsland() from the game repo (src/gamestate/sketch/islandSketch.ts).
    // One line per hex row, one character per hex: ' ' no land, '.' neutral land, '*' neutral forest,
    // 'a'-'f' land of faction 1-6, 'A'-'F' town of faction 1-6
    const GRID_MAX_DIMENSION = 100
    const FACTION_LETTERS = 'abcdefghijklmnopqrstuvwxyz'
    // the default theme's faction colors
    const FACTION_COLORS = ['#106600', '#d8a353', '#6fae33', '#da7553', '#886347', '#545c62']

    function sketchIsland(state) {
        const factionByRegion = new Map()
        for (const faction of state.factions ?? []) {
            for (const regionId of faction.regions ?? []) factionByRegion.set(regionId, faction.id)
        }
        const forests = new Set(state.pawns.filter(p => p.type === 'forest').map(p => p.hex))
        const towns = new Set(state.pawns.filter(p => p.type === 'town').map(p => p.hex))
        const rows = []
        for (const region of state.regions) {
            const factionId = factionByRegion.get(region.id)
            for (const hexId of region.hexes) {
                const x = hexId % GRID_MAX_DIMENSION
                const y = Math.floor(hexId / GRID_MAX_DIMENSION)
                while (rows.length <= y) rows.push([])
                while (rows[y].length <= x) rows[y].push(' ')
                let char = '.'
                if (factionId === 0) {
                    if (forests.has(hexId)) char = '*'
                } else if (factionId !== undefined) {
                    char = FACTION_LETTERS[factionId - 1] ?? '?'
                    if (towns.has(hexId)) char = char.toUpperCase()
                }
                rows[y][x] = char
            }
        }
        return rows.map(row => row.join('')).join('\n')
    }

    function showSketch(data) {
        DOM.sketch.replaceChildren()
        // game states have regions at the top level, replays keep them in a snapshot
        const state = data?.regions ? data : data?.snapshot
        if (!state?.regions || !state.pawns) return
        let sketch
        try {
            sketch = sketchIsland(state)
        } catch (err) {
            console.error(err)
            DOM.sketch.textContent = `Sketch error: ${err.message}`
            return
        }
        sketch.split('\n').forEach((line, y) => {
            const row = document.createElement('div')
            row.className = 'sketch-row' + (y % 2 === 0 ? ' even' : '')
            for (const char of line) {
                const hex = document.createElement('span')
                hex.className = 'sketch-hex'
                const factionIndex = FACTION_LETTERS.indexOf(char.toLowerCase())
                if (char === ' ') {
                    hex.style.visibility = 'hidden'
                } else if (factionIndex >= 0) {
                    hex.style.background = FACTION_COLORS[factionIndex] ?? 'magenta'
                    if (char !== char.toLowerCase()) hex.textContent = '⌂'
                } else {
                    hex.style.background = '#bdb7a6'
                    if (char === '*') {
                        hex.textContent = '♣'
                        hex.style.color = '#2f5d2a'
                    }
                }
                row.appendChild(hex)
            }
            DOM.sketch.appendChild(row)
        })
        const raw = document.createElement('pre')
        raw.textContent = sketch
        DOM.sketch.appendChild(raw)
    }

</script>
</body>


</html>
