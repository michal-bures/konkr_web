name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

# a running deploy finishes, pushes made meanwhile collapse into one deploy of the newest commit
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # the whole job, checkout included, comparable to Netlify's deploy time
      - id: start
        run: |
          echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # The day's first run clones and saves .git, later runs fetch only the new commit into it. No fallback
      # to an older day's cache, so the saved clone never piles up objects of builds deleted since
      - uses: actions/cache@v4
        with:
          path: .git
          key: konkr-web-git-${{ steps.start.outputs.day }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec jekyll build
      # Cloudflare serves privacy.html at /privacy and the root index.html at paths without a file on its own,
      # and rewrites even where a file exists, so the Netlify catch-all would answer assets with the game page
      - name: Drop the Netlify-only rules
        run: |
          sed -i -E '/^\/(privacy|\*)[[:space:]]/d' _site/_redirects
          if grep -E '^\/(privacy|\*)[[:space:]]' _site/_redirects; then echo "Netlify-only rules left in _redirects"; exit 1; fi
      # bunx installs wrangler in a few seconds, npx took 13
      - uses: oven-sh/setup-bun@v2
      - name: Deploy
        # pinned: wrangler changes behaviour within a major (4.154 hands `pages` commands to Workers)
        run: bunx wrangler@4.154.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Notify Discord
        if: success() || failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          # Discord user ID to ping on releases; no ping when unset
          PING_USER_ID: ${{ vars.DISCORD_PING_USER_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_DEPLOY_WEBHOOK is not set, skipping the deploy notification"; exit 0; fi
          title=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)
          seconds=$(( $(date +%s) - DEPLOY_START ))
          # konkr2's publish.yml titles release commits "release v<version>"
          version=$(printf '%s' "$title" | sed -nE 's/^release (v[0-9.]+)$/\1/p')
          if [ -n "$version" ]; then
            mention=${PING_USER_ID:+<@$PING_USER_ID> }
            if [ "$JOB_STATUS" = success ]; then
              embed=$(jq -n --arg v "$version" --arg s "$seconds" \
                '{title: "🚀 Konkr \($v) is live", url: "https://konkr.io", description: "Deployed to Cloudflare in \($s) s", color: 3066993}')
            else
              embed=$(jq -n --arg v "$version" --arg url "$RUN_URL" \
                '{title: "❌ Konkr \($v) failed to deploy", url: $url, color: 15158332}')
            fi
            jq -n --arg content "${mention}" --arg id "$PING_USER_ID" --argjson embed "$embed" \
              '{content: $content, embeds: [$embed], allowed_mentions: {parse: [], users: ([$id] - [""])}}' > payload.json
          else
            if [ "$JOB_STATUS" = success ]; then
              content="Deployed to Cloudflare in $seconds s: $title"
            else
              content="❌ Cloudflare deploy failed: $title
          > $RUN_URL"
            fi
            jq -n --arg content "$content" '{content: $content, allowed_mentions: {parse: []}}' > payload.json
          fi
          curl --fail-with-body -sS -H 'Content-Type: application/json' -d @payload.json "$WEBHOOK"
